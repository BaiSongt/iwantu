name: next-app-ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iwantu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iwantu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: next-app

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iwantu_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Invariant tests
        run: npm test

      - name: M1 changed-code lint
        run: npm run lint:m1

      - name: M2 changed-code lint
        run: npm run lint:m2

      - name: M3 changed-code lint
        run: npm run lint:m3

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # master currently carries legacy ESLint failures from React/Next rule changes.
      # Keep them visible without making unrelated UI cleanup a prerequisite for M1/M2/M3.
      - name: Legacy full-repository lint baseline
        continue-on-error: true
        run: npm run lint
